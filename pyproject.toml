[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "devx-coding-agent"
version = "0.2.0-dev.0"
description = "A local-first, approval-gated AI coding agent."
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Benoy Bose", email = "benoybose@cosq.net" }]
keywords = ["ai", "coding-agent", "llm", "developer-tools", "cli", "tui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["typer>=0.12", "textual>=0.70"]

[project.urls]
Homepage = "https://github.com/cosq-network/devx"
Repository = "https://github.com/cosq-network/devx"
Issues = "https://github.com/cosq-network/devx/issues"
Changelog = "https://github.com/cosq-network/devx/blob/main/CHANGELOG.md"

[project.optional-dependencies]
agent = ["langchain>=1.0", "langgraph>=1.0", "langgraph-checkpoint-sqlite>=2.0", "aiosqlite>=0.20", "langchain-openai>=1.0"]
tui = ["textual>=0.70"]
cli = ["typer>=0.12"]
openai = ["langchain-openai>=1.0"]
anthropic = ["langchain-anthropic>=1.0"]
azure = ["langchain-openai>=1.0"]
google = ["langchain-google-genai>=2.0"]
embeddings = ["numpy>=1.26", "onnxruntime>=1.18", "transformers>=4.40", "sentence-transformers>=3.0"]
tracing = ["langsmith>=0.2"]
ssh = ["paramiko>=3.0"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "pyright>=1.1"]
all = ["langchain>=1.0", "langgraph>=1.0", "langgraph-checkpoint-sqlite>=2.0", "aiosqlite>=0.20", "langchain-openai>=1.0", "langchain-anthropic>=1.0", "langchain-google-genai>=2.0", "textual>=0.70", "typer>=0.12", "numpy>=1.26", "onnxruntime>=1.18", "transformers>=4.40", "sentence-transformers>=3.0", "langsmith>=0.2", "paramiko>=3.0"]

[project.scripts]
devx = "devx.cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/devx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
