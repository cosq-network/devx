name: CI

on:
  push:
    branches: [main, develop, 'feature/**', 'release/**', 'hotfix/**']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  static-analysis:
    name: Static Analysis & Security Audits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install development dependencies
        run: python -m pip install -c constraints.txt -e ".[dev,cli,tui,agent]"
      - name: Lint (Ruff)
        run: python -m ruff check src tests scripts
      - name: Bytecode compilation
        run: python -m compileall -q src tests scripts
      - name: Offline DX benchmark
        run: python scripts/benchmark.py
      - name: Dependency audit (pip-audit)
        run: python -m pip install pip-audit && python -m pip_audit -r requirements-audit.txt
      - name: Static security scan (bandit)
        run: python -m pip install bandit && python -m bandit -r src -q
      - name: License policy scan
        run: python -m pip install pip-licenses && pip-licenses --fail-on="GPL;AGPL"
      - name: Check for secrets
        # The committed .secrets.baseline audits known fixtures; scan exits 1 when
        # NEW un-audited secrets appear, turning this into a real gate. The
        # version is pinned so future releases with different heuristics can't
        # silently invalidate the baseline.
        run: python -m pip install detect-secrets==1.5.0 && detect-secrets scan --baseline .secrets.baseline

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install development dependencies
        run: python -m pip install -c constraints.txt -e ".[dev,cli,tui,agent]"
      - name: Test with coverage
        run: python -m pytest -q --junitxml=test-results.xml --cov=src/devx --cov-report=xml --cov-report=term-missing
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.python }}
          path: test-results.xml
          retention-days: 7
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python }}
          path: coverage.xml
          retention-days: 7

  remote-e2e:
    name: Remote SSH e2e (real sshd)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install development dependencies
        run: python -m pip install -c constraints.txt -e ".[dev,cli,tui,agent,ssh]"
      - name: Run real SSH end-to-end tests
        env:
          DEVX_E2E_REMOTE: '1'
        run: python -m pytest -q tests/test_remote_e2e.py

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - run: python -m pip install build
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - run: devx doctor

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
