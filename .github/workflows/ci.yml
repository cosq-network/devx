name: CI

on:
  push:
    branches: [main, develop, 'feature/**', 'release/**', 'hotfix/**']
  pull_request:
    branches: [main, develop]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install development dependencies
        run: python -m pip install -c constraints.txt -e ".[dev,cli,tui,agent]"
      - name: Lint
        run: python -m ruff check src tests scripts
      - name: Compile
        run: python -m compileall -q src tests scripts
      - name: Test
        run: python -m pytest -q
      - name: Offline DX benchmark
        run: python scripts/benchmark.py
      - name: Dependency audit (pip-audit)
        run: python -m pip install pip-audit && python -m pip_audit -r requirements-audit.txt || true
      - name: Static security scan (bandit)
        run: python -m pip install bandit && python -m bandit -r src -q
      - name: License policy scan
        run: python -m pip install pip-licenses && pip-licenses --fail-on="GPL;AGPL"
      - name: Provider contract
        run: python -m pytest -q tests/test_provider_contract.py
      - name: Check for secrets
        run: python -m pip install detect-secrets && detect-secrets scan --baseline .secrets.baseline || true

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - run: devx doctor

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
