name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  sign:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Sign distributions with Sigstore
        uses: sigstore/gh-action-sigstore-python@v2.1.1
        with:
          python-version: '3.12'
      - uses: actions/upload-artifact@v4
        with:
          name: signed-dist
          path: dist/
          retention-days: 1

  publish:
    needs: sign
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      # Mandatory for OIDC trusted publishing: without this the action cannot
      # mint the token it uses to identify itself to PyPI.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: signed-dist
          path: dist/
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verify-metadata: true

  generate-sbom:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: dist/
          format: spdx-json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 90

  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate changelog
        run: |
          # First release has no previous tag; fall back to the full history.
          PREV_TAG="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
          git log --oneline --no-merges ${PREV_TAG:+$PREV_TAG..}HEAD | sed 's/^/- /' > CHANGELOG.md
      - uses: actions/upload-artifact@v4
        with:
          name: changelog
          path: CHANGELOG.md
