name: Scheduled Security Scan

on:
  schedule:
    # Weekly on Monday at 2 AM UTC
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  scheduled-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: python -m pip install -c constraints.txt -e ".[dev,cli,tui,agent]"
      - name: Dependency audit (pip-audit)
        run: python -m pip install pip-audit && python -m pip_audit -r requirements-audit.txt
      - name: Static security scan (bandit)
        run: python -m pip install bandit && python -m bandit -r src -q
      - name: License policy scan
        run: python -m pip install pip-licenses && pip-licenses --fail-on="GPL;AGPL"
      - name: Check for secrets
        run: python -m pip install detect-secrets==1.5.0 && detect-secrets scan --baseline .secrets.baseline
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'